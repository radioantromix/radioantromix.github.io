<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Radio Antromix - Player en Vivo</title>

  <!-- Fuentes de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@300;400;600;700;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Font Awesome para Iconos -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #080c14;
      font-family: "Saira Condensed", system-ui, -apple-system, sans-serif;
      color: #ffffff;
      user-select: none;
    }

    /* Fondo de la Radio */
    .bg-container {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, #1a0b2e 0%, #080c14 80%);
      z-index: 0;
    }
    .bg-image {
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?q=80&w=1920&auto=format&fit=crop');
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      opacity: 0.3;
      mix-blend-mode: luminosity;
    }
    .bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(8,12,20,0.85) 0%, rgba(8,12,20,0.5) 50%, rgba(8,12,20,0.95) 100%);
    }

    /* Glassmorphism Panel */
    .glass-panel {
      background: rgba(15, 20, 30, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Rotating Neon Border Styles */
    @keyframes neonRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .neon-border-wrapper {
      position: relative;
      border-radius: 9999px;
      padding: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 12px var(--neon-glow, rgba(255, 255, 255, 0.3));
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .neon-border-wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        var(--neon-color1, #00f0ff) 90deg,
        transparent 180deg,
        var(--neon-color2, #ff007f) 270deg,
        transparent 360deg
      );
      animation: neonRotate 3s linear infinite;
      z-index: 0;
    }

    .neon-border-wrapper:hover {
      box-shadow: 0 0 20px var(--neon-glow, rgba(255, 255, 255, 0.6));
    }

    .neon-border-content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .social-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Sidebar Social Slider (Costado Derecho) */
    #socialSlider {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #socialSlider.closed {
      transform: translateY(-50%) translateX(calc(100% - 2rem)) !important;
    }

    /* TikTok Chat Container */
    .tiktok-chat-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      max-width: 520px;
      z-index: 30;
      display: flex;
      flex-direction: column;
    }

    .chat-messages-scroll {
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%);
    }
    .chat-messages-scroll::-webkit-scrollbar { display: none; }

    .message-item {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 16px;
      width: fit-content;
      max-width: 90%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      animation: fadeInMsg 0.25s ease-out;
    }
    @keyframes fadeInMsg {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Reacciones Flotantes */
    .floating-reaction {
      position: fixed;
      font-size: 2rem;
      pointer-events: none;
      z-index: 100;
      animation: floatUpAndFade 1.6s ease-out forwards;
    }
    @keyframes floatUpAndFade {
      0% { opacity: 1; transform: translateY(0) scale(0.8) rotate(0deg); }
      50% { opacity: 0.9; transform: translateY(-80px) scale(1.3) rotate(15deg); }
      100% { opacity: 0; transform: translateY(-160px) scale(1.6) rotate(-15deg); }
    }
  </style>
</head>
<body>

  <!-- Elemento de Audio Oculto -->
  <audio id="audioStream" src="https://stream.zeno.fm/0swxrk8k8mzuv" crossorigin="anonymous" preload="none"></audio>

  <!-- Imagen y Gradiente de Fondo -->
  <div class="bg-container">
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
  </div>

  <!-- Notificación Toast -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-[#ff0050] text-white font-bold px-6 py-2 rounded-full shadow-2xl hidden flex items-center gap-2 border border-white/20 text-lg">
    <i class="fas fa-magic animate-pulse"></i>
    <span id="toastText">Notificación</span>
  </div>

  <!-- Header & Reproductor Principal -->
  <header class="fixed top-0 left-0 w-full z-40 p-3 sm:p-5 bg-gradient-to-b from-black/95 via-black/70 to-transparent flex flex-col sm:flex-row justify-between items-center gap-3">
    <!-- Brand Radio Antromix -->
    <div class="flex items-center gap-3">
      <div class="relative">
        <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full overflow-hidden border-2 border-[#ff0050] shadow-[0_0_20px_rgba(255,0,80,0.6)] bg-black">
          <img src="https://i.imgur.com/SaXdQWH.gif" alt="Cover Radio" class="w-full h-full object-cover"/>
        </div>
        <span id="livePulse" class="hidden absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 border-2 border-black rounded-full animate-ping"></span>
      </div>
      <div class="flex flex-col">
        <div class="flex items-center gap-2">
          <h1 class="font-extrabold text-2xl sm:text-3xl text-white tracking-wider leading-none uppercase drop-shadow-md">
            RADIO ANTROMIX
          </h1>
          <span class="bg-[#ff0050] text-white text-[11px] font-bold px-2 py-0.5 rounded flex items-center gap-1 shadow">
            <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span>
            CHAT EN VIVO
          </span>
        </div>
        <p class="text-xs text-white/70 font-sans tracking-wide">La Mejor Música en Vivo | Stream Zeno FM</p>
      </div>
    </div>

    <!-- Controles del Player -->
    <div class="flex items-center gap-2.5 sm:gap-3">
      <!-- Columna Perfil / Bloqueados -->
      <div class="flex flex-col gap-1 items-stretch min-w-[125px] sm:min-w-[135px]">
        <button id="profileBtn" class="glass-panel px-3 py-1 rounded-full flex items-center justify-between gap-2 border border-white/20 hover:bg-white/20 transition-all text-xs sm:text-sm cursor-pointer" title="Cambiar mi nombre de usuario">
          <div class="flex items-center gap-1.5 truncate">
            <span id="profileDot" class="w-2.5 h-2.5 rounded-full shrink-0 shadow bg-[#ff0050]"></span>
            <span id="profileName" class="font-bold tracking-wide truncate max-w-[85px] sm:max-w-[95px]">Oyente</span>
          </div>
          <i class="fas fa-edit text-white/70 text-[11px]"></i>
        </button>

        <button id="blockedUsersBtn" class="glass-panel px-3 py-1 rounded-full flex items-center justify-between gap-1.5 border border-white/20 hover:bg-white/20 transition-all text-xs text-red-400 hover:text-red-300 cursor-pointer" title="Gestionar usuarios bloqueados">
          <div class="flex items-center gap-1.5">
            <i class="fas fa-user-slash text-[11px]"></i>
            <span class="font-medium text-[11px]">Bloqueados</span>
          </div>
          <span id="blockedCount" class="font-bold bg-red-500/20 px-1.5 py-0.2 rounded-full text-[10px]">0</span>
        </button>
      </div>

      <!-- Panel Botón Play + Ecualizador + Volumen -->
      <div class="glass-panel rounded-full px-4 py-2 flex items-center gap-3 border border-white/20 shadow-2xl backdrop-blur-xl bg-black/50">
        <button id="playBtn" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-gradient-to-r from-[#ff0050] to-[#e81c1c] text-white flex items-center justify-center shadow-[0_0_20px_rgba(255,0,80,0.5)] hover:scale-110 active:scale-95 transition-all cursor-pointer">
          <i id="playIcon" class="fas fa-play text-lg ml-0.5"></i>
        </button>

        <!-- Visualizador de Barras -->
        <div class="flex items-end gap-1 h-7 px-1.5 border-x border-white/10" id="visualizer">
          <span class="w-1 rounded-t bg-[#50de39] h-2 transition-all"></span>
          <span class="w-1 rounded-t bg-[#d3eb3f] h-3 transition-all"></span>
          <span class="w-1 rounded-t bg-[#eba53c] h-1 transition-all"></span>
          <span class="w-1 rounded-t bg-[#e81c1c] h-2 transition-all"></span>
          <span class="w-1 rounded-t bg-[#50de39] h-3 transition-all"></span>
          <span class="w-1 rounded-t bg-[#d3eb3f] h-1 transition-all"></span>
        </div>

        <!-- Slider de Volumen -->
        <div class="flex items-center gap-1.5">
          <button id="muteBtn" class="text-white/80 hover:text-white">
            <i id="muteIcon" class="fas fa-volume-up text-sm"></i>
          </button>
          <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.95" class="w-14 sm:w-20 accent-[#ff0050] cursor-pointer"/>
        </div>
      </div>
    </div>
  </header>

  <!-- Social Sidebar Slider (Costado Derecho) -->
  <aside id="socialSlider">
    <!-- Botón desplegable tipo Slider (a la izquierda del panel) -->
    <button id="toggleSocialBtn" class="w-8 h-16 bg-black hover:bg-neutral-900 text-white rounded-l-xl flex items-center justify-center border-y border-l border-neutral-800 shadow-2xl cursor-pointer transition-all duration-300 mr-0" title="Mostrar / Ocultar Redes Sociales">
      <i id="toggleSocialIcon" class="fas fa-chevron-right text-sm transition-transform duration-300"></i>
    </button>

    <!-- Panel contenedor de redes sociales -->
    <div id="socialButtonsContainer" class="bg-black border-y border-l border-neutral-800 rounded-l-2xl py-2.5 pl-2.5 pr-2 flex flex-col gap-3.5 shadow-2xl shrink-0">
      <!-- Facebook Link con Borde Neón Giratorio -->
      <div class="neon-border-wrapper w-12 h-12 shrink-0 group active:scale-90 active:rotate-12 transition-transform duration-150 cursor-pointer" style="--neon-color1: #0084ff; --neon-color2: #00d2ff; --neon-glow: rgba(0, 132, 255, 0.7);">
        <a href="https://www.facebook.com/Radioantromix" target="_blank" rel="noopener noreferrer" class="neon-border-content social-btn !bg-[#1877f2]/90 hover:!bg-[#1877f2] active:!shadow-[0_0_35px_#0084ff] text-white" title="Facebook">
          <i class="fab fa-facebook-f text-lg group-hover:scale-110 group-active:scale-125 transition-transform"></i>
        </a>
      </div>

      <!-- TikTok Button con Borde Neón Giratorio (Fondo Fijo Negro) -->
      <div class="neon-border-wrapper w-12 h-12 shrink-0 group active:scale-90 active:-rotate-12 transition-transform duration-150 cursor-pointer" style="--neon-color1: #ff0050; --neon-color2: #00f2fe; --neon-glow: rgba(255, 0, 80, 0.7);">
        <a href="https://www.facebook.com/Radioantromix" target="_blank" rel="noopener noreferrer" class="neon-border-content social-btn !bg-black hover:!bg-neutral-900 text-white" title="TikTok">
          <i class="fab fa-tiktok text-lg group-hover:scale-110 group-active:scale-125 transition-transform text-white"></i>
        </a>
      </div>

      <!-- Share Button con Borde Neón Giratorio -->
      <div class="neon-border-wrapper w-12 h-12 shrink-0 group active:scale-90 active:rotate-6 transition-transform duration-150 cursor-pointer" style="--neon-color1: #a855f7; --neon-color2: #00f0ff; --neon-glow: rgba(168, 85, 247, 0.7);">
        <button id="shareBtn" class="neon-border-content social-btn !bg-black/80 hover:!bg-neutral-900 text-white" title="Compartir">
          <i class="fas fa-share-alt text-lg group-hover:scale-110 group-active:scale-125 transition-transform"></i>
        </button>
      </div>

      <!-- Gift Button con Borde Neón Giratorio -->
      <div class="neon-border-wrapper w-12 h-12 shrink-0 group active:scale-90 active:rotate-12 transition-transform duration-150 cursor-pointer" style="--neon-color1: #ffd700; --neon-color2: #ff6b00; --neon-glow: rgba(255, 215, 0, 0.7);">
        <button id="giftBtn" class="neon-border-content social-btn !bg-black/80 hover:!bg-neutral-900 text-[#ffd700]" title="Donación / Apoyar">
          <i class="fas fa-coins text-lg group-hover:scale-110 group-active:scale-125 transition-transform"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Interfaz de Chat TikTok en Vivo -->
  <div class="tiktok-chat-container">
    <div class="chat-messages-scroll" id="chatMessages">
      <!-- Mensajes del Chat -->
    </div>

    <!-- Banner de Respuesta Activa -->
    <div id="replyBanner" class="hidden bg-[#ff0050]/90 backdrop-blur-md rounded-xl px-3 py-1.5 text-white flex items-center justify-between border border-white/20 text-xs mb-1 font-sans pointer-events-auto">
      <div class="flex items-center gap-2 truncate">
        <i class="fas fa-reply"></i>
        <span class="font-bold">Respondiendo a @<span id="replyTargetUser"></span>:</span>
        <span id="replyTargetText" class="italic truncate opacity-90"></span>
      </div>
      <button id="cancelReplyBtn" class="p-1 hover:bg-white/20 rounded-full">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Barra de Reacciones y Formulario de Chat -->
    <form id="chatForm" class="mt-2 flex flex-col gap-2 pointer-events-auto relative">
      <div class="flex items-center justify-center gap-2 py-1 bg-black/60 backdrop-blur-md rounded-full border border-white/10 px-3">
        <button type="button" class="reaction-btn hover:scale-125 transition-transform text-2xl p-1" onclick="sendEmojiReaction('🔥', this)">🔥</button>
        <button type="button" class="reaction-btn hover:scale-125 transition-transform text-2xl p-1" onclick="sendEmojiReaction('❤️', this)">❤️</button>
        <button type="button" class="reaction-btn hover:scale-125 transition-transform text-2xl p-1" onclick="sendEmojiReaction('🙌', this)">🙌</button>
        <button type="button" class="reaction-btn hover:scale-125 transition-transform text-2xl p-1" onclick="sendEmojiReaction('🎉', this)">🎉</button>
        <button type="button" class="reaction-btn hover:scale-125 transition-transform text-2xl p-1" onclick="sendEmojiReaction('😂', this)">😂</button>
        <button type="button" class="reaction-btn hover:scale-125 transition-transform text-2xl p-1" onclick="sendEmojiReaction('🤩', this)">🤩</button>
        <button type="button" class="reaction-btn hover:scale-125 transition-transform text-2xl p-1" onclick="sendEmojiReaction('🚀', this)">🚀</button>
      </div>

      <div class="flex items-center gap-2">
        <input id="chatInput" type="text" autocomplete="off" placeholder="Escribe tu mensaje en vivo..." class="w-full bg-white/15 border border-white/20 backdrop-blur-2xl rounded-full px-5 py-2.5 text-white placeholder-white/60 text-base outline-none focus:border-[#ff0050] transition-colors"/>
        <button type="submit" class="bg-[#ff0050] text-white px-5 py-2.5 rounded-full font-bold text-base hover:bg-rose-600 transition-colors shadow-lg shrink-0 flex items-center gap-1.5 cursor-pointer">
          <span>Enviar</span>
          <i class="fas fa-paper-plane text-xs"></i>
        </button>
      </div>
    </form>
  </div>

  <!-- Modal de Usuarios Bloqueados -->
  <div id="blockedModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="glass-panel bg-black/90 border border-white/20 rounded-2xl p-6 w-full max-w-md shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-4">
        <h3 class="text-xl font-bold text-white flex items-center gap-2">
          <i class="fas fa-user-slash text-[#ff0050]"></i>
          Usuarios Bloqueados
        </h3>
        <button id="closeBlockedModalBtn" class="text-white/60 hover:text-white p-1 cursor-pointer">
          <i class="fas fa-times text-lg"></i>
        </button>
      </div>
      <p class="text-xs text-white/70 font-sans mb-3">Los mensajes de estos usuarios no aparecerán en tu pantalla.</p>
      <div id="blockedListContainer" class="max-h-60 overflow-y-auto flex flex-col gap-2 pr-1">
        <!-- Lista Dinámica -->
      </div>
      <div class="mt-4 pt-3 border-t border-white/10 text-right">
        <button id="closeBlockedModalFooterBtn" class="bg-white/20 hover:bg-white/30 text-white font-semibold px-5 py-1.5 rounded-full text-sm cursor-pointer">
          Cerrar
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="fixed bottom-2 left-0 w-full text-center z-20 pointer-events-none">
    <div class="text-white/70 text-xs sm:text-sm tracking-wider uppercase font-semibold drop-shadow">
      Desarrollado por: <span class="text-[#ff0050] font-bold">djlog</span> | RADIO Antromix
    </div>
  </footer>

  <!-- Script Firebase & Controladores -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      limit, 
      serverTimestamp 
    } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    // Configuración Firebase Real para Firestore en vivo
    const firebaseConfig = {
      projectId: "chilego",
      appId: "1:687060463982:web:1f0991d8835b62c746d17f",
      apiKey: "AIzaSyCDrzHUKCh86Mo3jfAvOhpfvrF_H007JIg",
      authDomain: "chilego.firebaseapp.com",
      firestoreDatabaseId: "ai-studio-remixaitalkradio-032ea431-7780-49fb-a98f-f5ffc96d2c36",
      storageBucket: "chilego.firebasestorage.app",
      messagingSenderId: "687060463982"
    };

    let db = null;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app, firebaseConfig.firestoreDatabaseId);
    } catch (e) {
      console.warn("Firestore notice:", e);
    }

    // Estado Local de Usuario
    let currentUserId = localStorage.getItem('antromix_uid') || ('user_' + Math.random().toString(36).substring(2, 10));
    localStorage.setItem('antromix_uid', currentUserId);

    let username = localStorage.getItem('antromix_username') || ('Oyente_' + Math.floor(1000 + Math.random() * 9000));
    localStorage.setItem('antromix_username', username);

    const presetColors = ['#ff0050', '#00f0ff', '#ffb700', '#00ff66', '#ff00f0', '#9d00ff', '#ff6b00', '#0099ff'];
    let userColor = localStorage.getItem('antromix_usercolor') || presetColors[Math.floor(Math.random() * presetColors.length)];
    localStorage.setItem('antromix_usercolor', userColor);

    // Usuarios Bloqueados
    let blockedUsers = JSON.parse(localStorage.getItem('antromix_blocked_users_details') || '[]');
    if (!Array.isArray(blockedUsers) || (blockedUsers.length > 0 && typeof blockedUsers[0] === 'string')) {
      const oldIds = JSON.parse(localStorage.getItem('antromix_blocked_users') || '[]');
      blockedUsers = oldIds.map(id => ({ id, username: 'Usuario' }));
    }

    function updateBlockedUI() {
      const count = blockedUsers.length;
      const countEl = document.getElementById('blockedCount');
      if (countEl) countEl.textContent = count;
      localStorage.setItem('antromix_blocked_users_details', JSON.stringify(blockedUsers));
      localStorage.setItem('antromix_blocked_users', JSON.stringify(blockedUsers.map(u => u.id)));
    }
    updateBlockedUI();

    let activeReply = null;
    let lastChatDocs = [
      { id: 'm1', userId: 'bot', username: 'DJ Log', userColor: '#ff0050', text: '¡Bienvenidos a Radio Antromix! Sintoniza la mejor música en vivo. 🔥🎶' },
      { id: 'm2', userId: 'bot2', username: 'Radio Staff', userColor: '#00f0ff', text: '¡Escribe tu saludo en el chat o deja tu reacción!' }
    ];

    // Actualizar UI Perfil
    const profileNameEl = document.getElementById('profileName');
    const profileDotEl = document.getElementById('profileDot');
    if (profileNameEl) profileNameEl.textContent = username;
    if (profileDotEl) profileDotEl.style.backgroundColor = userColor;

    // Audio Player
    const audioStream = document.getElementById('audioStream');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const visualizer = document.getElementById('visualizer');
    const livePulse = document.getElementById('livePulse');
    const volumeSlider = document.getElementById('volumeSlider');
    const muteBtn = document.getElementById('muteBtn');
    const muteIcon = document.getElementById('muteIcon');

    let isPlaying = false;

    if (playBtn && audioStream) {
      playBtn.addEventListener('click', () => {
        if (isPlaying) {
          audioStream.pause();
          isPlaying = false;
          if (playIcon) playIcon.className = 'fas fa-play text-lg ml-0.5';
          if (livePulse) livePulse.classList.add('hidden');
          if (visualizer) visualizer.querySelectorAll('span').forEach(s => s.className = 'w-1 rounded-t bg-[#ff0050] h-2');
        } else {
          audioStream.play().then(() => {
            isPlaying = true;
            if (playIcon) playIcon.className = 'fas fa-pause text-lg';
            if (livePulse) livePulse.classList.remove('hidden');
            if (visualizer) visualizer.querySelectorAll('span').forEach((s, idx) => {
              const h = ['h-6 animate-pulse', 'h-4 animate-bounce', 'h-7 animate-pulse', 'h-5 animate-bounce'];
              s.className = `w-1 rounded-t bg-[#50de39] ${h[idx % 4]}`;
            });
          }).catch(err => {
            showToast('Presiona Reproducir para iniciar el streaming');
          });
        }
      });
    }

    if (volumeSlider && audioStream) {
      volumeSlider.addEventListener('input', (e) => {
        audioStream.volume = parseFloat(e.target.value);
      });
    }

    if (muteBtn && audioStream) {
      muteBtn.addEventListener('click', () => {
        audioStream.muted = !audioStream.muted;
        if (muteIcon) muteIcon.className = audioStream.muted ? 'fas fa-volume-mute text-red-400' : 'fas fa-volume-up';
      });
    }

    // Render Chat
    function renderChatMessages() {
      const chatMessages = document.getElementById('chatMessages');
      if (!chatMessages) return;
      chatMessages.innerHTML = '';

      const blockedIds = blockedUsers.map(u => u.id);

      lastChatDocs.forEach(msg => {
        if (blockedIds.includes(msg.userId)) return;

        const item = document.createElement('div');
        item.className = 'message-item';

        let replyHtml = '';
        if (msg.replyTo) {
          replyHtml = `
            <div class="mb-1 px-2 py-0.5 rounded bg-white/10 border-l-2 border-[#ff0050] text-xs font-sans text-white/80 flex items-center gap-1 truncate">
              <i class="fas fa-reply text-[#ff0050] text-[10px]"></i>
              <span class="font-bold text-[#ff0050]">@${msg.replyTo.username}:</span>
              <span class="truncate italic font-light">"${msg.replyTo.text}"</span>
            </div>
          `;
        }

        item.innerHTML = `
          ${replyHtml}
          <div class="flex items-baseline justify-between gap-2">
            <div>
              <span class="username font-bold" style="color: ${msg.userColor || '#ff0050'}">${msg.username}:</span>
              <span class="text text-sm font-sans">${msg.text}</span>
            </div>
            <div class="flex items-center gap-1 opacity-80 hover:opacity-100 shrink-0 ml-2">
              <button class="text-xs text-white/70 hover:text-white p-1 cursor-pointer" onclick="setReply('${msg.id}', '${msg.username}', '${msg.text.replace(/'/g, "\\'")}')" title="Responder">
                <i class="fas fa-reply"></i>
              </button>
              ${msg.userId !== currentUserId ? `
                <button class="text-xs text-red-400 hover:text-red-300 p-1 cursor-pointer" onclick="blockUser('${msg.userId}', '${msg.username}')" title="Bloquear usuario">
                  <i class="fas fa-ban"></i>
                </button>
              ` : ''}
            </div>
          </div>
        `;

        chatMessages.appendChild(item);
      });

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    renderChatMessages();

    // Listener Firestore
    if (db) {
      try {
        const messagesRef = collection(db, 'messages');
        const q = query(messagesRef, orderBy('createdAt', 'desc'), limit(50));
        onSnapshot(q, (snapshot) => {
          const docs = [];
          snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
          docs.reverse();
          if (docs.length > 0) {
            lastChatDocs = docs;
            renderChatMessages();
          }
        }, (err) => {
          console.warn('Firestore snapshot notice:', err);
        });
      } catch (e) {
        console.warn('Firestore notice:', e);
      }
    }

    // Submit Chat
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');

    if (chatForm && chatInput) {
      chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;

        chatInput.value = '';

        const newMsg = {
          id: 'local_' + Date.now(),
          userId: currentUserId,
          username: username,
          userColor: userColor,
          text: text,
          replyTo: activeReply
        };

        lastChatDocs.push(newMsg);
        renderChatMessages();

        if (db) {
          try {
            await addDoc(collection(db, 'messages'), {
              userId: currentUserId,
              username: username,
              userColor: userColor,
              text: text,
              replyTo: activeReply,
              createdAt: serverTimestamp()
            });
          } catch (err) {
            console.error('Error enviando a Firestore:', err);
          }
        }

        clearReply();
      });
    }

    // Acciones de Botones
    document.getElementById('profileBtn')?.addEventListener('click', () => {
      const newName = prompt('Ingresa tu nuevo nombre de usuario para el chat:', username);
      if (newName && newName.trim()) {
        username = newName.trim();
        localStorage.setItem('antromix_username', username);
        if (profileNameEl) profileNameEl.textContent = username;
        showToast('¡Nombre de usuario actualizado!');
      }
    });

    document.getElementById('shareBtn')?.addEventListener('click', () => {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(window.location.href);
        showToast('¡Enlace copiado al portapapeles!');
      } else {
        showToast('Comparte este enlace con tus amigos');
      }
    });

    document.getElementById('giftBtn')?.addEventListener('click', async () => {
      showToast('¡Regalo virtual enviado a la transmisión! 🔥');
      const giftMsg = {
        id: 'gift_' + Date.now(),
        userId: currentUserId,
        username: username,
        userColor: userColor,
        text: '¡Ha enviado un regalo virtual: Fuego Antromix! 🔥'
      };
      lastChatDocs.push(giftMsg);
      renderChatMessages();

      if (db) {
        try {
          await addDoc(collection(db, 'messages'), {
            userId: currentUserId,
            username: username,
            userColor: userColor,
            text: giftMsg.text,
            createdAt: serverTimestamp()
          });
        } catch (err) {
          console.error('Error enviando regalo:', err);
        }
      }
    });

    window.setReply = (id, targetUser, targetText) => {
      activeReply = { id, username: targetUser, text: targetText };
      document.getElementById('replyTargetUser').textContent = targetUser;
      document.getElementById('replyTargetText').textContent = targetText;
      document.getElementById('replyBanner')?.classList.remove('hidden');
    };

    function clearReply() {
      activeReply = null;
      document.getElementById('replyBanner')?.classList.add('hidden');
    }

    document.getElementById('cancelReplyBtn')?.addEventListener('click', clearReply);

    window.blockUser = (uid, name) => {
      if (uid === currentUserId) {
        showToast('No puedes bloquearte a ti mismo');
        return;
      }
      if (!blockedUsers.some(u => u.id === uid)) {
        blockedUsers.push({ id: uid, username: name });
        updateBlockedUI();
        showToast(`Usuario @${name} bloqueado`);
        renderChatMessages();
      }
    };

    window.unblockUser = (uid) => {
      const target = blockedUsers.find(u => u.id === uid);
      const name = target ? target.username : 'Usuario';
      blockedUsers = blockedUsers.filter(u => u.id !== uid);
      updateBlockedUI();
      showToast(`Usuario @${name} desbloqueado`);
      renderBlockedList();
      renderChatMessages();
    };

    function renderBlockedList() {
      const container = document.getElementById('blockedListContainer');
      if (!container) return;
      container.innerHTML = '';

      if (blockedUsers.length === 0) {
        container.innerHTML = `<p class="text-sm text-white/50 py-4 text-center font-sans">No tienes usuarios bloqueados.</p>`;
        return;
      }

      blockedUsers.forEach(user => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between p-2.5 rounded-xl bg-white/10 border border-white/10';
        div.innerHTML = `
          <div class="flex items-center gap-2">
            <i class="fas fa-user-circle text-white/60 text-lg"></i>
            <span class="font-bold text-white text-sm">@${user.username}</span>
          </div>
          <button class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-3.5 py-1.5 rounded-full cursor-pointer transition-colors" onclick="unblockUser('${user.id}')">
            Desbloquear
          </button>
        `;
        container.appendChild(div);
      });
    }

    document.getElementById('blockedUsersBtn')?.addEventListener('click', () => {
      renderBlockedList();
      document.getElementById('blockedModal')?.classList.remove('hidden');
    });

    document.getElementById('closeBlockedModalBtn')?.addEventListener('click', () => {
      document.getElementById('blockedModal')?.classList.add('hidden');
    });

    document.getElementById('closeBlockedModalFooterBtn')?.addEventListener('click', () => {
      document.getElementById('blockedModal')?.classList.add('hidden');
    });

    // Toggle Slider Redes Sociales (Costado Derecho)
    const socialSlider = document.getElementById('socialSlider');
    const toggleSocialBtn = document.getElementById('toggleSocialBtn');
    const toggleSocialIcon = document.getElementById('toggleSocialIcon');

    if (toggleSocialBtn && socialSlider) {
      toggleSocialBtn.addEventListener('click', () => {
        const isClosed = socialSlider.classList.toggle('closed');
        if (toggleSocialIcon) {
          toggleSocialIcon.className = isClosed 
            ? 'fas fa-chevron-left text-sm transition-transform duration-300' 
            : 'fas fa-chevron-right text-sm transition-transform duration-300';
        }
      });
    }

    // Reacciones Flotantes
    window.sendEmojiReaction = async (emoji, btn) => {
      let rect = btn ? btn.getBoundingClientRect() : null;
      const span = document.createElement('span');
      span.className = 'floating-reaction';
      span.innerText = emoji;
      if (rect) {
        span.style.left = `${rect.left + (Math.random() - 0.5) * 40}px`;
        span.style.top = `${rect.top}px`;
      } else {
        span.style.left = `${window.innerWidth / 2}px`;
        span.style.top = `${window.innerHeight - 120}px`;
      }
      document.body.appendChild(span);
      setTimeout(() => span.remove(), 1600);

      if (db) {
        try {
          await addDoc(collection(db, 'reactions'), {
            emoji: emoji,
            createdAt: serverTimestamp()
          });
        } catch (err) {
          console.warn('Error enviando reacción:', err);
        }
      }
    };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      if (toast && toastText) {
        toastText.textContent = msg;
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 2500);
      }
    }
  </script>
</body>
</html>
